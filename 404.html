<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 🔴 GitHub Pages 的專案站掛在 /<repo>/ 底下，不是網域根目錄。
     而 404.html 會被拿來回應**任何**深度的錯誤網址（/metric-website/a/b/c），
     所以這一頁不能用相對路徑，也不能用 `/style.css` 這種根目錄絕對路徑
     —— 前者會相對到 /a/b/ 找不到，後者會去 mlmicocake-beep.github.io/style.css 找不到。
     用 <base> 把所有相對路徑釘在站根。搬到自有網域的根目錄時改成 "/"。 -->
<base href="/metric-website/">
<meta name="description" content="METRIC 是裝在企業自有伺服器上的 AI 助理平台。">
<title>找不到這一頁 — METRIC</title>
<link rel="icon" type="image/svg+xml" href="brand/metric-badge-ink.svg">
<link rel="alternate icon" href="brand/favicon.ico">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<!-- 社群預覽（LINE／Slack／Teams 貼連結時長什麼樣）。
     🔴 og:image 必須是**絕對網址** —— 爬蟲不會套 <base>，相對路徑一律抓不到。
     沒有 og:image 時各家會自己去猜，實測 LINE 會抓 apple-touch-icon。
     🔴 圖只能用 brand/og-image.png（圓形黑底白波形）。品牌資料夾裡那幾個紅色的
     不是產品在用的標誌 —— 就是它害預覽圖跟品牌對不上過一次。
     搬到自有網域時這裡的絕對網址要一起換。 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="METRIC">
<meta property="og:locale" content="zh_TW">
<meta property="og:title" content="找不到這一頁 — METRIC">
<meta property="og:description" content="METRIC 是裝在企業自有伺服器上的 AI 助理平台。">
<meta property="og:url" content="https://mlmicocake-beep.github.io/metric-website/404.html">
<meta property="og:image" content="https://mlmicocake-beep.github.io/metric-website/brand/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">

</head>
<body>
<header>
  <div class="nav">
    <a class="brand" href="index.html"><img class="mark" src="brand/metric-badge-ink.svg" alt="" aria-hidden="true">
      <span>METRIC</span></a>
    <nav>
      <a href="index.html">介紹</a>
      <a href="guide.html">如何使用</a>
      <a href="download.html">下載</a>
      <a href="about.html">關於我</a>
    </nav>
  </div>
</header>
<div class="hero">
  <div class="wrap">
    <p class="eyebrow">404</p>
    <h1>找不到這一頁</h1>
    <p class="lead">可能是連結太舊了，也可能是網址少打了一個字。
       下面這幾頁，應該有你要找的東西。</p>
    <div class="cta">
      <a class="btn" href="index.html">回首頁</a>
      <a class="btn alt" href="download.html">下載</a>
      <a class="btn alt" href="guide.html">如何使用</a>
    </div>
  </div>
</div>
</body>
</html>
